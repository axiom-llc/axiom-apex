name: Platform packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "apex/**", "pyproject.toml", ".github/workflows/platform.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-rag
          ref: d1abb22357d4397914f204198ef26d2ca434bbe8
          path: axiom-rag
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build matching platform wheels
        run: |
          python -m pip install setuptools wheel pytest responses
          python -m pip wheel --no-deps --no-build-isolation -w wheelhouse ./axiom-rag ./source ./source/packages/ason ./source/packages/harness ./source/packages/api
          python -m pip install wheelhouse/*.whl
          python -m pip check
      - name: Test installed policy, orchestration and transport packages
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/source/packages/ason/ason/tests" -q
          python -m unittest discover -s "$GITHUB_WORKSPACE/source/packages/harness/tests" -v
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/source/packages/api/tests" -q
      - name: Verify package imports and metadata
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import ason, axiom_harness, api_framework, gemini_client; from importlib.metadata import version; print({p: version(p) for p in ('axiom-ason', 'axiom-harness', 'axiom-api')})"
