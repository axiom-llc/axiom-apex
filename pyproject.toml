[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-apex"
version = "3.2.0"
description = "AI agent runtime — schema-validated recorded plans and bounded tool execution"
authors = [{ name = "AXIOM LLC", email = "axiom.co@proton.me" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "llm", "automation", "deterministic", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flask",
    "requests",
    "google-genai>=1.66.0",
    "axiom-rag>=1.5.0",
]

[project.scripts]
apex = "apex.__main__:main"

[project.urls]
Releases = "https://github.com/axiom-llc/axiom-apex/releases"
Homepage = "https://axiom-llc.github.io"
Repository = "https://github.com/axiom-llc/axiom-apex"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]

[tool.setuptools.package-data]
"apex" = ["*.txt"]

[tool.pytest.ini_options]
markers = [
    "host_isolation: real boundary probes run from the host, not recursively inside candidates",
    "integration: end-to-end tests requiring GEMINI_API_KEY",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
