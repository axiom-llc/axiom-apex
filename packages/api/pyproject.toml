[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-api"
version = "0.1.1"
description = "Reusable base client for REST API integrations"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_framework*", "gemini_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
