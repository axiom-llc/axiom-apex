name: APEX CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: python -m pip install pytest
      - name: Real kernel boundary and controller probes
        run: python -m pytest tests/test_rsi.py tests/test_rsi_isolation.py -k 'not test_real_apex_candidate_regressions_and_benchmark' -q
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolation primitive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Install dependencies
        run: |
          python -m pip install 'axiom-rag @ git+https://github.com/axiom-llc/axiom-rag.git@5366a9b' '.[dev]' build
      - name: RSI regression gate
        run: python -m pytest tests/test_rsi.py -q
      - name: Offline suite including real kernel isolation probes
        run: python -m pytest tests -m 'not integration' -q
      - name: Compile and build
        run: |
          python -m compileall -q apex benchmarks tests
          python -m build
          git diff --check
      - name: Installed package smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from apex._rsi_sandbox import run; from apex import rsi'
          apex --version
