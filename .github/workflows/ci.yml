name: APEX CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Authorize Bubblewrap namespace setup
        run: |
          printf 'abi <abi/4.0>,\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo apparmor_parser -r
      - name: Enable delegated resource controllers
        run: |
          sudo install -d /run/systemd/system/user@"$(id -u)".service.d
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee /run/systemd/system/user@"$(id -u)".service.d/axiom-rsi.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart user@"$(id -u)".service
      - run: python -m pip install pytest
      - name: Real kernel boundary and controller probes
        run: python -m pytest tests/test_rsi.py tests/test_rsi_isolation.py tests/test_rsi_resources.py -k 'not test_real_apex_candidate_regressions_and_benchmark' -q
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library recovery demo
        run: python tests/test_recovery_demo.py
      - name: Install isolation primitive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Authorize Bubblewrap namespace setup
        run: |
          printf 'abi <abi/4.0>,\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo apparmor_parser -r
      - name: Enable delegated resource controllers
        run: |
          sudo install -d /run/systemd/system/user@"$(id -u)".service.d
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee /run/systemd/system/user@"$(id -u)".service.d/axiom-rsi.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart user@"$(id -u)".service
      - name: Checkout matching RAG dependency
        uses: actions/checkout@v4
        with:
          repository: axiom-llc/axiom-rag
          ref: ef006233e2a6c9df5e783dec64affe035809ff3a
          path: .ci-rag
          persist-credentials: false
      - name: Verify checkout credentials removed
        run: |
          for repo in . .ci-rag; do
            if git -C "$repo" config --local --name-only --get-regexp 'core\.sshcommand|http\..*\.extraheader'; then
              echo "::error::Checkout credentials remain configured"
              exit 1
            fi
          done
          test "$(git -C .ci-rag rev-parse HEAD)" = ef006233e2a6c9df5e783dec64affe035809ff3a
      - name: Install dependencies
        run: |
          python -m pip install ./.ci-rag '.[dev]' build
          python -c "import shutil; shutil.rmtree('.ci-rag')"
          python -m pip check
      - name: RSI regression gate
        run: python -m pytest tests/test_rsi.py tests/test_rsi_autonomous.py -q
      - name: Offline suite including real kernel isolation probes
        run: python -m pytest tests -m 'not integration' -q
      - name: Independently benchmark planner candidate ablations
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'rsi/lab-verified-planner')
        run: |
          python -m benchmarks.planner_ablation --baseline-ref 3d9109cf786b0b64a9eeaa2f4c2b2b59983d4ded --trials 20 --operations 450 --output "$RUNNER_TEMP/planner-ablation.json"
      - name: Preserve independent planner performance evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'rsi/lab-verified-planner')
        uses: actions/upload-artifact@v4
        with:
          name: planner-ablation-${{ github.run_id }}
          path: ${{ runner.temp }}/planner-ablation.json
          retention-days: 90
          if-no-files-found: warn
      - name: Autonomous RSI experiment (local branches only; no model)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'rsi/')
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AXIOM RSI CI"
          git config user.email "rsi-ci@users.noreply.github.com"
          git checkout -b rsi-ci-baseline
          python -m apex rsi --generator rules --cycles 4 --budget-tokens 200000 > "$RUNNER_TEMP/rsi-lab.json"
          python -m apex.rsi_lab_evidence "$RUNNER_TEMP/rsi-lab.json" --output "$RUNNER_TEMP/rsi-roi.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"])/"rsi-lab.json").read_text())
          roi = json.loads((Path(os.environ["RUNNER_TEMP"])/"rsi-roi.json").read_text())
          assert data["generator"] == "rules"
          assert data["provider_calls"] == 0
          assert data["stop_reason"] in {"CONVERGED_NO_CANDIDATES",
              "NO_MATERIAL_IMPROVEMENT", "HOLDOUT_REJECTED", "BUDGET", "MAX_CYCLES"}
          print("RSI_RESULT " + json.dumps({
              "accepted_generations": len(data["accepted_branches"]),
              "generated_candidates": data["generated_candidates"],
              "tested_candidates": data["tested_candidates"],
              "stop_reason": data["stop_reason"],
              "full_evaluation_overhead_seconds": data["elapsed_seconds"],
              "roi": roi,
          }, sort_keys=True))
          PY
          git checkout -
          git diff --exit-code
      - name: Retain autonomous RSI evidence artifact
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'rsi/')
        uses: actions/upload-artifact@v4
        with:
          name: rsi-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rsi-lab.json
            ${{ runner.temp }}/rsi-roi.json
          retention-days: 90
          if-no-files-found: warn
      - name: Compile and build
        run: |
          python -m compileall -q apex benchmarks tests
          python -m build
          git diff --check
      - name: Installed package smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from apex._rsi_sandbox import run; from apex import rsi'
          apex --version

